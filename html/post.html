<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Publicación | Marketplace Unison</title>
    <link rel="stylesheet" href="../css/styleMain.css">
    <style>
        /* ========================================================
           EL NUEVO DISEÑO MINIMALISTA
           ======================================================== */
        body {
            background-color: #f0f2f5; /* El fondo gris clarito de la imagen */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .contenedor-publicar {
            max-width: 900px;
            margin: 0 auto;
        }

        .volver-link {
            display: inline-block;
            font-weight: bold;
            color: #000;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .volver-link:hover {
            text-decoration: underline;
        }

        /* --- LA CUADRÍCULA PRINCIPAL --- */
        .grid-superior {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Mitad y mitad */
            gap: 20px;
            margin-bottom: 20px;
        }

        /* --- COLUMNA IZQUIERDA (Inputs) --- */
        .columna-inputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo general para todos los campos blancos */
        .campo-blanco {
            background-color: #ffffff;
            border: none;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 16px;
            color: #555;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .campo-blanco:focus {
            box-shadow: 0 4px 12px rgba(0,132,255,0.15);
        }

        /* --- COLUMNA DERECHA (La caja gigante de fotos) --- */
        .caja-fotos {
            background-color: #ffffff;
            border: 2px solid #ccc; /* Un borde gris sutil */
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 250px;
        }

        .caja-fotos:hover {
            border-color: #0084ff;
            background-color: #f9fbfd;
        }

        /* Ocultamos el input de archivo real porque es feo, usaremos la caja como botón */
        #imagenes {
            display: none;
        }

        #preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
        }

        /* --- LA CAJA GIGANTE DE ABAJO (Descripción) --- */
        .caja-descripcion {
            background-color: #ffffff;
            border: none;
            padding: 30px;
            border-radius: 20px;
            font-size: 16px;
            color: #555;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 100%;
            min-height: 200px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            text-align: center; /* Centrado como en tu imagen */
        }

        /* --- EL BOTÓN DE SUBIR --- */
        .btn-subir {
            background-color: #007bff; /* El azul brillante de tu imagen */
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            transition: background-color 0.2s;
        }

        .btn-subir:hover {
            background-color: #0056b3;
        }

        .btn-subir:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="contenedor-publicar">

        <a href="main.html" class="volver-link">&lt; Volver</a>

        <form id="formPublicar" enctype="multipart/form-data">

            <div class="grid-superior">

                <div class="columna-inputs">
                    <input type="text" id="titulo" name="titulo" class="campo-blanco" placeholder="Nombre de producto" required>

                    <input type="number" id="precio" name="precio" class="campo-blanco" placeholder="Precio ($)" step="0.01" required>

                    <select id="categoria" name="categoria" class="campo-blanco" required>
                        <option value="" disabled selected>Categoría</option>
                        <option value="Tecnologia">Tecnología</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Comida">Comida</option>
                        <option value="Libros">Libros</option>
                        <option value="Papeleria">Papelería</option>
                        <option value="Otros">Otros</option>
                    </select>

                    <select id="estado" name="estado" class="campo-blanco" required>
                        <option value="" disabled selected>Estado del producto</option>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Usado - Como Nuevo">Usado - Como Nuevo</option>
                        <option value="Usado - Buen estado">Usado - Buen estado</option>
                        <option value="Usado - Aceptable">Usado - Aceptable</option>
                    </select>
                </div>

                <div class="caja-fotos" id="zona-click-fotos">
                    <div id="texto-fotos">
                        <span style="font-size: 30px;">📸</span><br>
                        Haz clic aquí para subir hasta 5 fotos
                    </div>
                    <input type="file" id="imagenes" name="imagenes[]" accept="image/*" multiple required>
                    <div id="preview-container"></div>
                </div>

            </div>

            <textarea id="descripcion" name="descripcion" class="caja-descripcion" placeholder="Descripción del producto"></textarea>

            <button type="submit" class="btn-subir">Subir</button>
            <div id="mensaje-respuesta" style="margin-top: 15px; font-weight: bold;"></div>

        </form>
    </div>

    <script src="../javascript/post.js"></script>
</body>
</html>
