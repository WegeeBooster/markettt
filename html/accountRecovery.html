<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styleLogin.css">
    <title>Recuperación de cuenta</title>
    <style>
        /* Indicador de pasos */
        .pasos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .paso {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ddd;
            color: #999;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .paso.activo {
            background: #007BFF;
            color: white;
        }
        .paso.completo {
            background: #28a745;
            color: white;
        }
        .linea-paso {
            flex: 1;
            height: 2px;
            background: #ddd;
            max-width: 40px;
        }
        .linea-paso.completa {
            background: #28a745;
        }
        /* Secciones del formulario */
        .seccion { display: none; }
        .seccion.activa { display: block; }

        /* Campos de código */
        .codigo-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
        }
        .codigo-container input {
            width: 40px !important;
            height: 48px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 0 !important;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .codigo-container input:focus {
            border-color: #007BFF;
            outline: none;
        }
        /* Demo badge */
        .badge-demo {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            color: #856404;
            margin-top: 10px;
            text-align: center;
        }
        /* Fuerza de contraseña */
        .barra-fuerza {
            height: 5px;
            border-radius: 3px;
            margin-top: 6px;
            transition: all 0.3s;
            background: #ddd;
        }
        .fuerza-debil   { background: #dc3545; width: 33%; }
        .fuerza-media   { background: #ffc107; width: 66%; }
        .fuerza-fuerte  { background: #28a745; width: 100%; }
        .texto-fuerza {
            font-size: 12px;
            margin-top: 4px;
            color: #666;
        }
        p.subtitulo {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 12px;
        }
        #mensaje-recovery {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        .reenviar-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #007BFF;
            cursor: pointer;
            font-size: 14px;
            background: none;
            border: none;
            padding: 0;
            text-decoration: underline;
        }
        .reenviar-link:disabled {
            color: #999;
            text-decoration: none;
            cursor: default;
        }
    </style>
</head>

<body>
<div class="contenedor">
    <form class="login" id="form-recovery" action="#">

        <img src="../marketplace_unison.png" alt="Logo">
        <h2>Recuperar contraseña</h2>

        <!-- Indicador de pasos -->
        <div class="pasos">
            <div class="paso activo" id="icono-paso-1">1</div>
            <div class="linea-paso" id="linea-1-2"></div>
            <div class="paso" id="icono-paso-2">2</div>
            <div class="linea-paso" id="linea-2-3"></div>
            <div class="paso" id="icono-paso-3">3</div>
        </div>

        <!-- PASO 1: Ingresar correo -->
        <div class="seccion activa" id="seccion-1">
            <p class="subtitulo">Ingresa tu correo y te enviaremos un código de verificación.</p>
            <input type="email" id="correo" placeholder="Correo Institucional" required>
            <button type="button" id="btn-solicitar">Enviar código</button>
            <div id="badge-demo" class="badge-demo" style="display:none;"></div>
        </div>

        <!-- PASO 2: Verificar código -->
        <div class="seccion" id="seccion-2">
            <p class="subtitulo" id="texto-correo-enviado">Ingresa el código de 6 dígitos enviado a tu correo.</p>
            <div class="codigo-container">
                <input type="text" maxlength="1" class="digito-codigo" inputmode="numeric">
                <input type="text" maxlength="1" class="digito-codigo" inputmode="numeric">
                <input type="text" maxlength="1" class="digito-codigo" inputmode="numeric">
                <input type="text" maxlength="1" class="digito-codigo" inputmode="numeric">
                <input type="text" maxlength="1" class="digito-codigo" inputmode="numeric">
                <input type="text" maxlength="1" class="digito-codigo" inputmode="numeric">
            </div>
            <button type="button" id="btn-verificar">Verificar código</button>
            <button type="button" class="reenviar-link" id="btn-reenviar" disabled>Reenviar código (60s)</button>
        </div>

        <!-- PASO 3: Nueva contraseña -->
        <div class="seccion" id="seccion-3">
            <p class="subtitulo">Escoge una nueva contraseña segura.</p>
            <input type="password" id="nueva-pass" placeholder="Nueva contraseña" oninput="verificarFuerza(this.value)">
            <div class="barra-fuerza" id="barra-fuerza"></div>
            <div class="texto-fuerza" id="texto-fuerza"></div>
            <input type="password" id="confirmar-pass" placeholder="Confirmar contraseña" style="margin-top:10px;">
            <button type="button" id="btn-cambiar">Guardar nueva contraseña</button>
        </div>

        <!-- Mensaje global -->
        <div id="mensaje-recovery"></div>

        <a href="login.html" class="boton">Volver a Iniciar sesión</a>

    </form>
</div>

<script>
// ============================================================
// ARCHIVO: javascript (inline) — accountRecovery.html
// ============================================================

let correoGlobal   = '';
let timerReenvio   = null;

// ── Utilidad para mostrar mensajes ──
function mostrarMensaje(texto, color = 'red') {
    const el = document.getElementById('mensaje-recovery');
    el.style.color = color;
    el.textContent = texto;
}

// ── Avanzar al paso indicado ──
function irAPaso(paso) {
    document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
    document.getElementById('seccion-' + paso).classList.add('activa');

    for (let i = 1; i <= 3; i++) {
        const icono = document.getElementById('icono-paso-' + i);
        icono.classList.remove('activo', 'completo');
        if (i < paso)  icono.classList.add('completo');
        if (i === paso) icono.classList.add('activo');
    }
    // Líneas
    if (paso > 1) {
        document.getElementById('linea-1-2').classList.add('completa');
    }
    if (paso > 2) {
        document.getElementById('linea-2-3').classList.add('completa');
    }
    document.getElementById('mensaje-recovery').textContent = '';
}

// ── PASO 1: Solicitar código ──
document.getElementById('btn-solicitar').addEventListener('click', async () => {
    const correo = document.getElementById('correo').value.trim();
    if (!correo) { mostrarMensaje('Ingresa tu correo.'); return; }

    const btn = document.getElementById('btn-solicitar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
        const res  = await fetch('../back-end/recoverPassword.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo, accion: 'solicitar' })
        });
        const data = await res.json();

        if (data.exito) {
            correoGlobal = correo;
            document.getElementById('texto-correo-enviado').textContent =
                'Código enviado a ' + correo;

            // Mostrar código en badge de demo (quitar en producción)
            if (data.codigo_demo) {
                const badge = document.getElementById('badge-demo');
                badge.style.display = 'block';
                badge.textContent = '🔧 Demo — Tu código es: ' + data.codigo_demo;
            }

            irAPaso(2);
            iniciarTemporizador();
        } else {
            mostrarMensaje('⚠️ ' + data.error);
        }
    } catch (e) {
        mostrarMensaje('⚠️ Error al conectar con el servidor.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar código';
    }
});

// ── Código: avance automático entre dígitos ──
document.querySelectorAll('.digito-codigo').forEach((input, idx, all) => {
    input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/, '');
        if (input.value && idx < all.length - 1) all[idx + 1].focus();
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !input.value && idx > 0) all[idx - 1].focus();
    });
});

// ── PASO 2: Verificar código ──
document.getElementById('btn-verificar').addEventListener('click', async () => {
    const digitos = [...document.querySelectorAll('.digito-codigo')].map(i => i.value).join('');
    if (digitos.length < 6) { mostrarMensaje('⚠️ Ingresa los 6 dígitos.'); return; }

    const btn = document.getElementById('btn-verificar');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
        const res  = await fetch('../back-end/recoverPassword.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo: correoGlobal, accion: 'verificar', codigo: digitos })
        });
        const data = await res.json();

        if (data.exito) {
            clearInterval(timerReenvio);
            irAPaso(3);
        } else {
            mostrarMensaje('⚠️ ' + data.error);
        }
    } catch (e) {
        mostrarMensaje('⚠️ Error al conectar con el servidor.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Verificar código';
    }
});

// ── Temporizador para reenviar ──
function iniciarTemporizador() {
    let segundos = 60;
    const btn = document.getElementById('btn-reenviar');
    btn.disabled = true;

    timerReenvio = setInterval(() => {
        segundos--;
        btn.textContent = 'Reenviar código (' + segundos + 's)';
        if (segundos <= 0) {
            clearInterval(timerReenvio);
            btn.disabled = false;
            btn.textContent = 'Reenviar código';
        }
    }, 1000);
}

document.getElementById('btn-reenviar').addEventListener('click', () => {
    document.getElementById('btn-solicitar').click();
});

// ── Fuerza de contraseña ──
function verificarFuerza(valor) {
    const barra = document.getElementById('barra-fuerza');
    const texto = document.getElementById('texto-fuerza');
    barra.className = 'barra-fuerza';

    if (!valor) { texto.textContent = ''; return; }

    const tieneNum   = /\d/.test(valor);
    const tieneMay   = /[A-Z]/.test(valor);
    const tieneEsp   = /[^A-Za-z0-9]/.test(valor);
    const largo      = valor.length >= 8;

    const puntos = [tieneNum, tieneMay, tieneEsp, largo].filter(Boolean).length;

    if (puntos <= 1) {
        barra.classList.add('fuerza-debil');
        texto.textContent = 'Contraseña débil';
        texto.style.color = '#dc3545';
    } else if (puntos <= 3) {
        barra.classList.add('fuerza-media');
        texto.textContent = 'Contraseña aceptable';
        texto.style.color = '#856404';
    } else {
        barra.classList.add('fuerza-fuerte');
        texto.textContent = 'Contraseña fuerte ✓';
        texto.style.color = '#155724';
    }
}

// ── PASO 3: Cambiar contraseña ──
document.getElementById('btn-cambiar').addEventListener('click', async () => {
    const nueva     = document.getElementById('nueva-pass').value;
    const confirmar = document.getElementById('confirmar-pass').value;

    if (!nueva || nueva.length < 4) {
        mostrarMensaje('⚠️ La contraseña debe tener al menos 4 caracteres.');
        return;
    }
    if (nueva !== confirmar) {
        mostrarMensaje('⚠️ Las contraseñas no coinciden.');
        return;
    }

    const btn = document.getElementById('btn-cambiar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
        const res  = await fetch('../back-end/recoverPassword.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo: correoGlobal, accion: 'cambiar', nueva_password: nueva })
        });
        const data = await res.json();

        if (data.exito) {
            mostrarMensaje('✅ ' + data.mensaje + ' Redirigiendo...', 'green');
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
            mostrarMensaje('⚠️ ' + data.error);
        }
    } catch (e) {
        mostrarMensaje('⚠️ Error al conectar con el servidor.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar nueva contraseña';
    }
});
</script>

</body>
</html>
